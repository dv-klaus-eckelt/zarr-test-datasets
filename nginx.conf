server {
    listen 8000;
    server_name localhost;

    # Where the Zarr data will be mounted
    root /usr/share/nginx/html;

    # Enable directory listing (like SimpleHTTPRequestHandler)
    autoindex on;

    location / {
        # --- CORS Headers ---
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'X-Requested-With, Content-Type, Range' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Range, Accept-Ranges, Content-Length' always;

        # Pre-flight OPTIONS request handling
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'X-Requested-With, Content-Type, Range';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}